<VirtualHost *:80>
  ServerName leeannholdings.co.za
  ServerAlias www.leeannholdings.co.za 72.62.31.228
  DocumentRoot /var/www/leeann

  <Directory /var/www/leeann>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.html
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/leeann-error.log
  CustomLog ${APACHE_LOG_DIR}/leeann-access.log combined
</VirtualHost>
